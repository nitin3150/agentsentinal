[tool.pyright]
extraPaths = ["."]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentsentinel"]
artifacts = ["src/agentsentinel/compliance/*.yaml"]

[tool.hatch.build.targets.sdist]
exclude = [
    ".venv/",
    "venv/",
    ".claude/",
    "demo/",
    "tests/",
    "*.env",
    ".env*",
    "__pycache__/",
    "*.pyc",
    ".git/",
]

[project]
name = "agentsentinel-ai"
version = "0.2.0"
description = "Production-readiness platform for AI agents — inspect, improve, and stress-test before you ship."
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
authors = [
    {name = "Nitin Goyal", email = "goyal.niti@northeastern.edu"},
]
keywords = ["ai", "agents", "llm", "security", "compliance", "langgraph", "prompt-engineering"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Topic :: Security",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Intended Audience :: Developers",
]
dependencies = [
    "pydantic>=2.0",
    "dspy-ai>=3.2.1",
    "langgraph>=1.1.10",
    "langchain>=1.2.18",
    "langchain-community>=0.3",
    "litellm>=1.0",
    "pyyaml>=6.0",
    "pdfplumber>=0.11",
    "click>=8.0",
    "rich>=13.0",
]

[project.optional-dependencies]
crewai  = ["crewai>=0.134.0"]
adk     = ["google-adk>=1.33.0"]
llama   = ["llama-index>=0.14.21"]

[project.scripts]
agentsentinel = "agentsentinel.cli.main:cli"

[project.urls]
Homepage      = "https://github.com/nitin3150/agentsentinel"
Repository    = "https://github.com/nitin3150/agentsentinel"
Documentation = "https://github.com/nitin3150/agentsentinel#readme"
"Bug Tracker" = "https://github.com/nitin3150/agentsentinel/issues"

[dependency-groups]
dev = [
    "pytest>=9.1.0",
]
