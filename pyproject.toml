[tool.pyright]
extraPaths = ["."]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentsentinal"]

[project]
name = "agentsentinal"
version = "0.1.0"
description = "Production-readiness platform for AI agents — InspectorAgent and downstream eval pipeline."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "arq>=0.28.0",
    "asyncpg>=0.31.0",
    "crewai>=0.134.0",
    "dspy-ai>=3.2.1",
    "fastapi>=0.136.1",
    "google-adk>=1.33.0",
    "google-generativeai>=0.8.6",
    "langchain>=1.2.18",
    "langchain-google-vertexai>=3.2.3",
    "langgraph>=1.1.10",
    "langsmith>=0.8.3",
    "llama-index>=0.14.21",
    "opentelemetry-exporter-otlp>=1.41.1",
    "opentelemetry-sdk>=1.41.1",
    "presidio-analyzer>=2.2.362",
    "presidio-anonymizer>=2.2.362",
    "pydantic>=2.13.4",
    "ragas>=0.4.3",
    "redis>=5.3.1",
    "sqlalchemy>=2.0.49",
    "uvicorn>=0.46.0",
]
